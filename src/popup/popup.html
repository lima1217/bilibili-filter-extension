<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>B站视频过滤器</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5h16l-6 8v6l-4-2v-4z" />
          </svg>
        </div>
        <div>
          <h1>B站视频过滤器</h1>
          <p id="statusText">过滤已开启</p>
        </div>
      </div>
      <label class="switch" title="总开关">
        <input type="checkbox" id="enabled">
        <span></span>
      </label>
    </header>

    <section class="page-card" id="pageCard"></section>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="block" role="tab">屏蔽列表</button>
      <button class="tab" data-tab="filter" role="tab">筛选条件</button>
      <button class="tab" data-tab="settings" role="tab">设置</button>
      <span class="tab-indicator"></span>
    </nav>

    <main>
      <!-- 屏蔽列表 -->
      <section class="panel active" data-panel="block">
        <div class="seg" role="tablist">
          <button class="seg-btn active" data-kind="keywords">关键词<i id="countKeywords">0</i></button>
          <button class="seg-btn" data-kind="uploaders">UP主<i id="countUploaders">0</i></button>
          <button class="seg-btn" data-kind="videos">视频<i id="countVideos">0</i></button>
        </div>

        <form class="adder" id="blockForm" autocomplete="off">
          <input id="blockInput" type="text">
          <button type="submit" class="btn-primary" aria-label="添加">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
          </button>
        </form>
        <p class="hint" id="blockHint"></p>

        <div class="list-tools" id="blockTools" hidden>
          <input id="blockSearch" type="search" placeholder="搜索列表…">
        </div>
        <ul class="list" id="blockList"></ul>
      </section>

      <!-- 筛选条件 -->
      <section class="panel" data-panel="filter">
        <div class="card" id="durationCard">
          <div class="card-head">
            <div>
              <h3>视频时长</h3>
              <p id="durationSummary"></p>
            </div>
            <label class="switch small"><input type="checkbox" id="durationEnabled"><span></span></label>
          </div>
          <div class="card-body">
            <div class="range">
              <label class="field"><span>隐藏短于</span><input id="durationMin" inputmode="decimal" placeholder="不限"><em>分钟</em></label>
              <label class="field"><span>隐藏长于</span><input id="durationMax" inputmode="decimal" placeholder="不限"><em>分钟</em></label>
            </div>
            <div class="chips" id="durationChips">
              <button data-bound="min" data-value="30">&lt; 30 秒</button>
              <button data-bound="min" data-value="60">&lt; 1 分钟</button>
              <button data-bound="min" data-value="180">&lt; 3 分钟</button>
              <button data-bound="max" data-value="1800">&gt; 30 分钟</button>
              <button data-bound="max" data-value="3600">&gt; 1 小时</button>
            </div>
          </div>
        </div>

        <div class="card" id="viewsCard">
          <div class="card-head">
            <div>
              <h3>播放量</h3>
              <p id="viewsSummary"></p>
            </div>
            <label class="switch small"><input type="checkbox" id="viewsEnabled"><span></span></label>
          </div>
          <div class="card-body">
            <div class="range">
              <label class="field"><span>隐藏低于</span><input id="viewsMin" placeholder="不限"><em>播放</em></label>
              <label class="field"><span>隐藏高于</span><input id="viewsMax" placeholder="不限"><em>播放</em></label>
            </div>
            <div class="chips" id="viewsChips">
              <button data-bound="min" data-value="1000">&lt; 1000</button>
              <button data-bound="min" data-value="10000">&lt; 1万</button>
              <button data-bound="min" data-value="100000">&lt; 10万</button>
              <button data-bound="max" data-value="10000000">&gt; 1000万</button>
            </div>
            <p class="card-note">支持输入「1.5万」这样的写法</p>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <div>
              <h3>内容类型</h3>
              <p>与关键词无关，按卡片类型直接隐藏</p>
            </div>
          </div>
          <div class="rows">
            <label class="row"><div><b>广告与推广</b><small>首页、搜索、视频页中的商业推广卡片</small></div><span class="switch small"><input type="checkbox" data-type="ads"><span></span></span></label>
            <label class="row"><div><b>直播</b><small>推荐流里混入的直播间</small></div><span class="switch small"><input type="checkbox" data-type="live"><span></span></span></label>
            <label class="row"><div><b>番剧 / 影视 / 课堂</b><small>首页穿插的非 UGC 推荐楼层</small></div><span class="switch small"><input type="checkbox" data-type="nonVideo"><span></span></span></label>
          </div>
        </div>
      </section>

      <!-- 设置 -->
      <section class="panel" data-panel="settings">
        <h4 class="group-title">生效页面</h4>
        <div class="card rows">
          <label class="row"><div><b>首页推荐</b></div><span class="switch small"><input type="checkbox" data-scope="home"><span></span></span></label>
          <label class="row"><div><b>搜索结果</b></div><span class="switch small"><input type="checkbox" data-scope="search"><span></span></span></label>
          <label class="row"><div><b>视频页相关推荐</b></div><span class="switch small"><input type="checkbox" data-scope="video"><span></span></span></label>
          <label class="row"><div><b>其他页面</b><small>热门、排行榜、分区等</small></div><span class="switch small"><input type="checkbox" data-scope="other"><span></span></span></label>
        </div>

        <h4 class="group-title">页面交互</h4>
        <div class="card rows">
          <label class="row"><div><b>悬停快捷屏蔽</b><small>鼠标移到视频封面时显示屏蔽按钮</small></div><span class="switch small"><input type="checkbox" data-ui="quickBlock"><span></span></span></label>
          <label class="row"><div><b>页面角标</b><small>左下角显示过滤数量，点击可预览</small></div><span class="switch small"><input type="checkbox" data-ui="badge"><span></span></span></label>
        </div>

        <h4 class="group-title">白名单 UP主 <span class="muted">不受关键词、时长、播放量等规则影响</span></h4>
        <div class="card">
          <form class="adder" id="whitelistForm" autocomplete="off">
            <input id="whitelistInput" type="text" placeholder="UP主名称 / UID / 空间链接">
            <button type="submit" class="btn-primary" aria-label="添加">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
            </button>
          </form>
          <ul class="list compact" id="whitelistList"></ul>
        </div>

        <h4 class="group-title">数据</h4>
        <div class="card actions">
          <button class="btn" id="exportBtn">导出配置</button>
          <button class="btn" id="importBtn">导入配置</button>
          <button class="btn" id="resetStatsBtn">统计清零</button>
          <button class="btn danger" id="resetAllBtn">恢复默认</button>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
        </div>
        <p class="about" id="about"></p>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../shared/core.js"></script>
  <script src="../shared/store.js"></script>
  <script src="popup.js"></script>
</body>

</html>
